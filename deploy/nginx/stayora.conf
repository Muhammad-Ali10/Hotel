# Stayora — one port, both halves, one origin.
#
# Its own `listen` rather than a `server_name` on :80, because this box already
# serves two other projects. They match on their hostnames; a bare IP matches
# none of them and would fall through to whichever server block is default.
# A dedicated port is unambiguous and touches nothing that already works.
#
#   /       →  Next.js   127.0.0.1:3020
#   /api    →  Nest      127.0.0.1:4020
#
# Same origin for both, so there is no CORS in play and the session cookie is
# never a cross-site cookie. That is the single biggest thing this layout buys.
#
#   sudo cp deploy/nginx/stayora.conf /etc/nginx/sites-available/stayora
#   sudo ln -s /etc/nginx/sites-available/stayora /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream stayora_web {
    server 127.0.0.1:3020;
    keepalive 32;
}

upstream stayora_api {
    server 127.0.0.1:4020;
    keepalive 32;
}

server {
    listen 8080;
    listen [::]:8080;

    # No server_name: this block owns the port, so anything arriving on it is
    # Stayora — by IP, by hostname, by anything.

    # Photo uploads go through the API. Nest refuses oversized bodies itself;
    # this stops nginx refusing them first with a less useful error.
    client_max_body_size 12m;

    # Long enough for a cold Next route or a slow report, short enough that a
    # wedged upstream does not hold connections open all day.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/stayora.access.log;
    error_log  /var/log/nginx/stayora.error.log;

    # ---------------------------------------------------------------- API --

    location /api/ {
        proxy_pass http://stayora_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # EXACTLY one hop, and this is it.
        #
        # The API sets `trust proxy` to 1, so it reads the LAST address in this
        # header as the client. `$proxy_add_x_forwarded_for` appends the real
        # peer to whatever arrived — which is correct here and only here,
        # because nothing else is in front. Put Cloudflare or another proxy
        # ahead of this and the hop count in main.ts must change with it, or
        # the rate limiter starts counting the wrong thing.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # --------------------------------------------------------------- Next --

    # Immutable build output. The hash in the filename IS the cache key, so a
    # deploy invalidates it by changing the name rather than by expiry.
    location /_next/static/ {
        proxy_pass http://stayora_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://stayora_web;

        proxy_http_version 1.1;
        # No WebSocket upgrade, and deliberately so. `next start` does not use
        # one — HMR is a dev-only thing, and streaming SSR is ordinary chunked
        # HTTP. Proxying it would need a `map $http_upgrade $connection_upgrade`
        # at the http level, and a duplicate of that map (one of the other two
        # projects may already declare it) makes nginx refuse to START, which
        # takes every site on this box down. Nothing here needs it.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
